# Compila el APK de Android TV / Fire TV y lo publica como release de GitHub.
# Descarga estable: https://github.com/victorodri/que-vemos-tv/releases/latest/download/que-vemos-tv.apk
# (o, más corta para teclearla con el mando: https://<tu-app>.vercel.app/apk)
name: APK Android TV

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL de la web (si se deja vacía, se usa la variable APP_URL del repo)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://que-vemos-tv.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Clave de firma fija (secretos del repo). Sin ella cada APK sale con una firma distinta
      # y Android no deja actualizar encima: habría que desinstalar antes.
      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64: se firma con una clave temporal."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: quevemos
        run: gradle assembleRelease --no-daemon -PappUrl="$APP_URL" -PversionCode=${{ github.run_number }}

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk que-vemos-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: que-vemos-tv-apk
          path: que-vemos-tv.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v${{ github.run_number }}" que-vemos-tv.apk \
            --title "QuéVer TV · versión 1.4.${{ github.run_number }}" \
            --notes "APK para Fire TV / Android TV. Carga $APP_URL" \
            --latest
